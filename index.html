<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Heita</title>
<meta name="description" content="Heita — a standalone social app that started as a like-for-like recreation of Meta's Threads, then added monetization and the product differentiators that make it its own thing instead of an Instagram appendage.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heita">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
/* ============ tokens ============ */
:root{
  --bg:#fff; --bg-elevated:#fff; --bg-hover:#f5f5f5; --bg-sunken:#fafafa;
  --text:#000; --text-secondary:#5c5c5c; --text-tertiary:#8e8e8e;
  --border:#e2e2e2; --border-soft:#efefef;
  --like:#f4054a; --accent:#000; --accent-text:#fff;
  --pro:#7c3aed; --danger:#d4183d; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#000; --bg-elevated:#101010; --bg-hover:#181818; --bg-sunken:#0a0a0a;
  --text:#f5f5f5; --text-secondary:#a8a8a8; --text-tertiary:#737373;
  --border:#262626; --border-soft:#1c1c1c;
  --like:#f4054a; --accent:#fff; --accent-text:#000;
  --pro:#a78bfa; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  transition:background .15s ease,color .15s ease;
}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--text);color:var(--bg);}
.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ============ shell / layout ============ */
#app{max-width:1200px;margin:0 auto;display:flex;min-height:100vh;}
.rail{
  width:76px;flex:none;display:flex;flex-direction:column;align-items:center;
  padding:20px 0;gap:6px;border-right:1px solid var(--border-soft);position:sticky;top:0;height:100vh;
}
.rail-logo{width:34px;height:34px;margin-bottom:18px;cursor:pointer;}
.rail-logo svg{width:100%;height:100%;fill:var(--text);}
.rail-btn{
  width:52px;height:48px;border:none;background:none;border-radius:12px;color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
}
.rail-btn svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:2;}
.rail-btn.active svg{fill:var(--text);}
.rail-btn:hover{background:var(--bg-hover);}
.rail-spacer{flex:1;}
.rail-dot{position:absolute;top:6px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--like);border:2px solid var(--bg);}
.rail-more{margin-top:auto;}

main.col{flex:1;min-width:0;max-width:630px;margin:0 auto;border-right:1px solid var(--border-soft);border-left:1px solid var(--border-soft);min-height:100vh;padding-bottom:70px;}
.topbar{
  position:sticky;top:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;
  height:52px;border-bottom:1px solid var(--border-soft);padding:0 16px;
}
.topbar .tb-title{font-weight:700;font-size:17px;}
.topbar .tb-logo-mobile{width:26px;height:26px;}
.topbar .tb-logo-mobile svg{width:100%;height:100%;fill:var(--text);}
.topbar .tb-side{position:absolute;right:14px;display:flex;gap:10px;align-items:center;}
.tb-icon-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:4px;display:flex;}
.tb-icon-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;height:54px;background:var(--bg);border-top:1px solid var(--border-soft);
  display:flex;z-index:30;max-width:630px;margin:0 auto;
}
@media (min-width:900px){.tabbar{display:none;} .rail{display:flex;}}
@media (max-width:899px){.rail{display:none;} main.col{border-left:none;}}
.tab-btn{flex:1;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--text);}
.tab-btn svg{width:25px;height:25px;stroke:var(--text);fill:none;stroke-width:2;}
.tab-btn.active svg{fill:var(--text);}
.tab-btn.compose{color:var(--text);}

/* ============ post card ============ */
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;position:relative;}
.post:hover{background:var(--bg-sunken);}
.post.focused{outline:2px solid var(--pro);outline-offset:-2px;border-radius:8px;}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;}
.avatar.lg{width:64px;height:64px;font-size:22px;}
.avatar.xl{width:88px;height:88px;font-size:30px;}
.post-body{flex:1;min-width:0;}
.post-head{display:flex;align-items:center;gap:6px;}
.post-name{font-weight:700;font-size:15px;}
.verified{width:15px;height:15px;fill:#3897f0;}
.post-time{color:var(--text-tertiary);font-size:15px;}
.post-head .spacer{flex:1;}
.more-dots{background:none;border:none;color:var(--text-tertiary);cursor:pointer;padding:4px;}
.post-text{font-size:15px;line-height:20px;white-space:pre-wrap;margin:2px 0 6px;word-break:break-word;}
.post-image{width:100%;border-radius:12px;margin:6px 0;background:linear-gradient(135deg,#e9e9e9,#cfcfcf);height:220px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;}
html[data-theme="dark"] .post-image{background:linear-gradient(135deg,#1c1c1c,#101010);}
.post-actions{display:flex;align-items:center;gap:2px;margin-top:6px;}
.pa-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:var(--text);cursor:pointer;padding:6px 8px 6px 0;font-size:13px;}
.pa-btn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;}
.pa-btn.liked svg{fill:var(--like);stroke:var(--like);}
.pa-btn.reposted svg{stroke:#2fb344;}
.pa-count{color:var(--text-tertiary);min-width:8px;}
.reply-line{font-size:13px;color:var(--text-tertiary);margin-top:2px;}
.pill{border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;border:1px solid var(--border);background:none;color:var(--text);cursor:pointer;}
.pill.solid{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.pill.pro{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border:none;}
.pill.small{padding:4px 10px;font-size:12px;}
.badge-pro{font-size:10px;font-weight:800;letter-spacing:.4px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;padding:1px 6px;border-radius:5px;margin-left:4px;}

.sponsored{background:var(--bg-sunken);}
.sponsored .post-time::before{content:"Sponsored · ";}
.spon-cta{margin-top:6px;}

/* ============ headers / sections ============ */
.section-title{font-size:20px;font-weight:800;padding:16px;}
.subtabs{display:flex;border-bottom:1px solid var(--border-soft);}
.subtab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:600;color:var(--text-tertiary);cursor:pointer;border-bottom:2px solid transparent;}
.subtab.active{color:var(--text);border-color:var(--text);}
.empty{padding:60px 24px;text-align:center;color:var(--text-tertiary);font-size:14px;}

/* profile */
.profile-head{padding:16px;}
.profile-top{display:flex;justify-content:space-between;align-items:flex-start;}
.profile-name{font-size:22px;font-weight:800;display:flex;align-items:center;}
.profile-handle{color:var(--text-secondary);font-size:14px;}
.profile-bio{margin:10px 0;font-size:14px;line-height:19px;}
.profile-stats{color:var(--text-tertiary);font-size:14px;margin-top:6px;}
.profile-actions{display:flex;gap:8px;margin-top:12px;}
.profile-actions .pill{flex:1;text-align:center;}

/* pulse */
.pulse-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
.pulse-rank{width:22px;color:var(--text-tertiary);font-weight:700;}
.pulse-live{width:8px;height:8px;border-radius:50%;background:#2fb344;box-shadow:0 0 0 0 rgba(47,179,68,.6);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,179,68,.5);}70%{box-shadow:0 0 0 8px rgba(47,179,68,0);}100%{box-shadow:0 0 0 0 rgba(47,179,68,0);}}
.pulse-topic{font-weight:700;font-size:15px;flex:1;}
.pulse-meta{color:var(--text-tertiary);font-size:12px;}

/* communities */
.community-card{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
.community-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg-sunken);flex:none;}
.community-info{flex:1;min-width:0;}
.community-name{font-weight:700;font-size:15px;}
.community-desc{color:var(--text-secondary);font-size:13px;margin-top:2px;}
.community-meta{color:var(--text-tertiary);font-size:12px;margin-top:2px;}

/* lists */
.list-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.list-row:hover{background:var(--bg-sunken);}

/* studio */
.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;}
.stat-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-label{color:var(--text-tertiary);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.stat-value{font-size:24px;font-weight:800;margin-top:4px;}
.stat-sub{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
.studio-block{padding:16px;border-top:8px solid var(--border-soft);}
.studio-block h3{margin:0 0 4px;font-size:16px;}
.studio-block p{margin:0 0 12px;color:var(--text-secondary);font-size:13px;line-height:18px;}
.row-flex{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.row-flex:last-child{border-bottom:none;}
.row-label{font-size:14px;font-weight:600;}
.row-desc{font-size:12px;color:var(--text-tertiary);margin-top:2px;max-width:420px;}

/* switch */
.switch{position:relative;width:42px;height:24px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.15s;}
.switch .track:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.switch input:checked + .track{background:#2fb344;}
.switch input:checked + .track:before{transform:translateX(18px);}

/* forms */
.field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.field:focus{outline:2px solid var(--text);}
textarea.field{resize:none;min-height:70px;}
.label-sm{font-size:12px;font-weight:700;color:var(--text-tertiary);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.3px;}

/* ============ modals ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media (min-width:640px){.overlay{align-items:center;}}
.modal{background:var(--bg-elevated);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
@media (min-width:640px){.modal{border-radius:20px;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--bg-elevated);}
.modal-title{font-weight:700;font-size:16px;}
.modal-body{padding:16px;}
.close-btn{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;padding:4px;}

.detail-post{padding:16px;border-bottom:1px solid var(--border-soft);}
.detail-post .post-text{font-size:18px;line-height:24px;}
.reply-thread{border-left:2px solid var(--border-soft);margin-left:34px;}

.compose-row{display:flex;gap:12px;}
.compose-text{flex:1;}
.compose-text textarea{border:none;padding:6px 0;font-size:16px;width:100%;background:transparent;color:var(--text);resize:none;min-height:80px;font-family:inherit;}
.compose-text textarea:focus{outline:none;}
.compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);}
@media (min-width:900px){.toast{bottom:24px;}}

.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:ui-monospace,monospace;font-size:12px;background:var(--bg-sunken);}
.shortcut-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}

.phase-note{margin:0 16px 16px;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;font-size:12px;color:var(--text-tertiary);line-height:17px;}
</style>
</head>
<body>

  <nav class="rail">
    <div class="rail-logo" data-action="go-home" title="Heita">

      <div class="tb-side">

    <div id="main"></div>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></button>

    <button class="tab-btn" data-tab="activity"><svg viewBox="0 0 24 24"><path d="M20.8 6.6c0 6-8.8 11.4-8.8 11.4S3.2 12.6 3.2 6.6a4.6 4.6 0 0 1 8.8-2 4.6 4.6 0 0 1 8.8 2z"/></svg></button>
    <button class="tab-btn" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg></button>
  </nav>

</div>

<div id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
